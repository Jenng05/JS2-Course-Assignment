<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Feed</title>
    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body class="bg-gray-100">
    <header class="bg-white shadow px-6 py-4 flex justify-between items-center">
      <h1 class="text-xl md:text-2xl font-bold">Social Feed</h1>
      <nav class="flex items-center gap-4">
        <a
          href="profile.html"
          class="text-blue-500 hover:underline whitespace-nowrap"
          >My Profile</a
        >
        <button
          id="logoutBtn"
          class="bg-gray-200 px-3 py-1 rounded hover:bg-gray-300"
        >
          Logout
        </button>
      </nav>
    </header>

    <main class="max-w-2xl mx-auto p-4">
      <section class="p-4 md:p-8 bg-white rounded-lg shadow mb-6">
        <h2 class="text-2xl md:text-3xl font-bold mb-6">Create Post</h2>
        <form id="createPostForm">
          <input
            type="text"
            id="postTitle"
            placeholder="Post title"
            required
            class="block w-full border border-gray-300 rounded px-3 py-2 mb-4"
          />
          <textarea
            id="postBody"
            placeholder="What's on your mind?"
            class="block w-full border border-gray-300 rounded px-3 py-2 mb-4"
          ></textarea>
          <button
            type="submit"
            class="bg-blue-500 text-white py-2 px-3 rounded hover:bg-blue-600"
          >
            Post
          </button>
        </form>
      </section>

      <section>
        <input
          type="search"
          id="searchInput"
          placeholder="Search posts..."
          class="block w-full border border-gray-300 rounded px-3 py-2 mb-4"
        />
        <div id="postsContainer"></div>
      </section>
    </main>
    <script type="module" src="js/feed/feed.js"></script>
  </body>
</html>
