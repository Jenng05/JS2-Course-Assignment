<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="css/output.css" />
  </head>
  <body class="bg-gray-100">
    <main class="max-w-md mx-auto mt-16 p-8 bg-white rounded-lg shadow">
      <h1 class="text-3xl font-bold mb-6">Register</h1>
      <form id="registerForm">
        <label class="block mb-1 font-medium" for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
          class="block w-full border border-gray-300 rounded px-3 py-2 mb-4"
        />

        <label for="email" class="block mb-1 font-medium">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
          class="block w-full border border-gray-300 rounded px-3 py-2 mb-4"
        />

        <label for="password" class="block mb-1 font-medium">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
          minlength="8"
          class="block w-full border border-gray-300 rounded px-3 py-2 mb-4"
        />

        <button
          type="submit"
          class="w-full bg-green-500 text-white py-2 px-3 rounded hover:bg-green-600"
        >
          Register
        </button>
      </form>
      <p class="mt-4 text-center">
        Already have an account?
        <a href="index.html" class="text-blue-500 hover:underline"
          >Login here</a
        >
      </p>
    </main>
    <script type="module" src="js/auth/register.js"></script>
  </body>
</html>
